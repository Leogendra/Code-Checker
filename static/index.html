<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coords finder</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1a1f26;
    --border: #2a323d;
    --text: #e6ecf3;
    --muted: #8a94a3;
    --accent: #4aa3ff;
    --ok: #35c26b;
    --ok-bg: rgba(53, 194, 107, 0.12);
    --ko: #e04c4c;
    --ko-bg: rgba(224, 76, 76, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
  p.lead {
    color: var(--muted);
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .board {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  .coords {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    align-items: flex-start;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .cell input {
    width: 54px;
    height: 60px;
    font-size: 1.6rem;
    text-align: center;
    background: #0e1216;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "SF Mono", "Consolas", monospace;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .cell input:focus {
    border-color: var(--accent);
  }
  .cell.solved input {
    border-color: var(--border);
    background: #14181d;
    color: var(--muted);
  }
  .group.revealed .cell.solved input {
    border-color: var(--ok);
    background: var(--ok-bg);
    color: var(--ok);
  }
  .cell.locked input {
    border-color: var(--ko);
    background: var(--ko-bg);
    color: var(--ko);
  }
  .cell .timer {
    font-size: 0.72rem;
    color: var(--ko);
    font-variant-numeric: tabular-nums;
    height: 14px;
  }
  .cell .idx {
    font-size: 0.68rem;
    color: var(--muted);
    height: 14px;
  }
  .dot {
    font-size: 1.8rem;
    color: var(--muted);
    margin: 0 2px;
    padding-bottom: 20px;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s, opacity 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  #status {
    text-align: center;
    color: var(--muted);
    margin-top: 20px;
    min-height: 20px;
    font-size: 0.9rem;
  }
  .final {
    margin-top: 24px;
    padding: 20px;
    background: var(--ok-bg);
    border: 1px solid var(--ok);
    border-radius: 10px;
    display: none;
  }
  .final.visible { display: block; }
  .final h2 { margin: 0 0 10px; color: var(--ok); font-size: 1.1rem; }
  .final .coords-line { font-family: "SF Mono", "Consolas", monospace; font-size: 1.2rem; margin: 6px 0; }
  .final a { color: var(--accent); }
  .global-lock {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--ko-bg);
    border: 1px solid var(--ko);
    border-radius: 8px;
    color: var(--ko);
    text-align: center;
    display: none;
  }
  .global-lock.visible { display: block; }
</style>
</head>
<body>
<main>
  <h1>Coords finder</h1>
  <p class="lead">
    Entre chaque paire de chiffres. Une mauvaise réponse bloque le champ pendant une heure.
    Les champs justes ne se colorent que quand le demi-groupe est complet.
  </p>

  <div class="board">
    <div class="coords" id="coords"></div>
    <div id="global-lock" class="global-lock"></div>
    <div id="status"></div>
    <div class="actions" id="actions" style="display:none">
      <button id="copy-btn" class="secondary">Copier les coordonnées</button>
      <button id="reveal-btn">Révéler le lieu</button>
    </div>
    <div id="final" class="final"></div>
  </div>
</main>

<script>
const NUM_FIELDS = 8;
const GROUPS = [[0, 1, 2, 3], [4, 5, 6, 7]];

const state = {
  fields: Array.from({ length: NUM_FIELDS }, (_, i) => ({
    id: i,
    solved: false,
    locked_until: null,
    value: "",
  })),
  all_solved: false,
  global_locked_until: null,
};

const els = {
  coords: document.getElementById("coords"),
  status: document.getElementById("status"),
  actions: document.getElementById("actions"),
  copyBtn: document.getElementById("copy-btn"),
  revealBtn: document.getElementById("reveal-btn"),
  final: document.getElementById("final"),
  globalLock: document.getElementById("global-lock"),
};

function buildLayout() {
  els.coords.innerHTML = "";
  GROUPS.forEach((groupIds, gi) => {
    const groupEl = document.createElement("div");
    groupEl.className = "group";
    groupEl.dataset.group = String(gi);

    groupIds.forEach((fid, pos) => {
      if (pos === 1) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.textContent = ".";
        groupEl.appendChild(dot);
      }
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.field = String(fid);

      const input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.maxLength = 2;
      input.autocomplete = "off";
      input.dataset.field = String(fid);
      input.addEventListener("input", onInput);
      input.addEventListener("blur", onBlur);
      input.addEventListener("keydown", onKey);

      const timer = document.createElement("div");
      timer.className = "timer";

      const idx = document.createElement("div");
      idx.className = "idx";
      idx.textContent = "#" + fid;

      cell.appendChild(input);
      cell.appendChild(timer);
      cell.appendChild(idx);
      groupEl.appendChild(cell);
    });

    els.coords.appendChild(groupEl);
  });
}

function onInput(e) {
  const el = e.target;
  el.value = el.value.replace(/\D/g, "").slice(0, 2);
  if (el.value.length === 2) {
    const next = findNextEditable(Number(el.dataset.field));
    if (next) next.focus();
  }
}

function onKey(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    submitField(Number(e.target.dataset.field));
  } else if (e.key === "Backspace" && !e.target.value) {
    const prev = findPrevEditable(Number(e.target.dataset.field));
    if (prev) prev.focus();
  }
}

function onBlur(e) {
  const fid = Number(e.target.dataset.field);
  const val = e.target.value;
  if (val.length === 2) submitField(fid);
}

function findNextEditable(fromId) {
  for (let i = fromId + 1; i < NUM_FIELDS; i++) {
    if (!state.fields[i].solved && !isFieldLocked(i)) {
      return document.querySelector(`input[data-field="${i}"]`);
    }
  }
  return null;
}

function findPrevEditable(fromId) {
  for (let i = fromId - 1; i >= 0; i--) {
    if (!state.fields[i].solved && !isFieldLocked(i)) {
      return document.querySelector(`input[data-field="${i}"]`);
    }
  }
  return null;
}

function isFieldLocked(fid) {
  const lu = state.fields[fid].locked_until;
  if (!lu) return false;
  return new Date(lu).getTime() > Date.now();
}

function isGroupRevealed(groupIndex) {
  return GROUPS[groupIndex].every((fid) => state.fields[fid].solved);
}

async function submitField(fid) {
  const f = state.fields[fid];
  if (f.solved || isFieldLocked(fid)) return;
  const input = document.querySelector(`input[data-field="${fid}"]`);
  const value = (input.value || "").trim();
  if (!/^\d{2}$/.test(value)) return;

  setStatus("Vérification…");
  try {
    const r = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ field_id: fid, value }),
    });
    const data = await r.json();
    if (data.error) {
      setStatus("Erreur : " + data.error);
      return;
    }
    if (data.correct) {
      state.fields[fid].solved = true;
      state.fields[fid].locked_until = null;
      state.fields[fid].value = value;
      setStatus(""); // pas de feedback par champ, on n'affiche que le groupe
      if (data.all_solved) {
        state.all_solved = true;
      }
    } else if (data.locked) {
      state.fields[fid].locked_until = data.retry_at || null;
      if (data.global && data.global_retry_at) {
        state.global_locked_until = data.global_retry_at;
      }
      setStatus("Mauvaise réponse. Réessaye plus tard.");
    }
    render();
  } catch (err) {
    setStatus("Erreur réseau.");
  }
}

function setStatus(msg) {
  els.status.textContent = msg;
}

async function loadState() {
  try {
    const r = await fetch("/api/state");
    const data = await r.json();
    data.fields.forEach((f) => {
      state.fields[f.id].solved = f.solved;
      state.fields[f.id].locked_until = f.locked_until;
    });
    state.all_solved = data.all_solved;
    state.global_locked_until = data.global_locked_until;
    render();
  } catch (e) {
    setStatus("Impossible de charger l'état.");
  }
}

function fmtCountdown(ms) {
  if (ms <= 0) return "";
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const h = Math.floor(m / 60);
  const min = m % 60;
  if (h > 0) return `${h}h${String(min).padStart(2, "0")}`;
  return `${min}:${String(sec).padStart(2, "0")}`;
}

function render() {
  state.fields.forEach((f) => {
    const cell = document.querySelector(`.cell[data-field="${f.id}"]`);
    const input = cell.querySelector("input");
    const timer = cell.querySelector(".timer");
    cell.classList.remove("solved", "locked");
    timer.textContent = "";

    const locked = isFieldLocked(f.id);
    if (f.solved) {
      cell.classList.add("solved");
      input.value = f.value || input.value || "**";
      input.disabled = true;
    } else if (locked) {
      cell.classList.add("locked");
      input.disabled = true;
      const remaining = new Date(f.locked_until).getTime() - Date.now();
      timer.textContent = fmtCountdown(remaining);
    } else {
      input.disabled = false;
    }
  });

  GROUPS.forEach((_, gi) => {
    const groupEl = document.querySelector(`.group[data-group="${gi}"]`);
    groupEl.classList.toggle("revealed", isGroupRevealed(gi));
  });

  const gl = state.global_locked_until && new Date(state.global_locked_until).getTime() > Date.now();
  els.globalLock.classList.toggle("visible", !!gl);
  if (gl) {
    const remaining = new Date(state.global_locked_until).getTime() - Date.now();
    els.globalLock.textContent = `Site verrouillé (trop d'erreurs). Réessaye dans ${fmtCountdown(remaining)}.`;
    document.querySelectorAll("input").forEach((i) => (i.disabled = true));
  }

  els.actions.style.display = state.all_solved ? "flex" : "none";
}

function copyCoords() {
  const parts = [];
  GROUPS.forEach((ids) => {
    const s = ids.map((i) => state.fields[i].value || "??").join("");
    parts.push(s.slice(0, 2) + "." + s.slice(2));
  });
  const txt = parts.join(", ");
  navigator.clipboard.writeText(txt).then(
    () => setStatus("Coordonnées copiées : " + txt),
    () => setStatus("Copie impossible."),
  );
}

async function reveal() {
  try {
    const r = await fetch("/api/reveal");
    if (!r.ok) {
      setStatus("Révélation impossible pour l'instant.");
      return;
    }
    const data = await r.json();
    els.final.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "Trouvé";
    els.final.appendChild(h);
    if (data.coords) {
      const p = document.createElement("div");
      p.className = "coords-line";
      p.textContent = data.coords;
      els.final.appendChild(p);
    }
    if (data.maps_url) {
      const a = document.createElement("a");
      a.href = data.maps_url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Ouvrir dans Google Maps";
      els.final.appendChild(a);
    }
    if (data.note) {
      const p = document.createElement("p");
      p.textContent = data.note;
      els.final.appendChild(p);
    }
    els.final.classList.add("visible");
  } catch (e) {
    setStatus("Erreur réseau lors de la révélation.");
  }
}

els.copyBtn.addEventListener("click", copyCoords);
els.revealBtn.addEventListener("click", reveal);

buildLayout();
loadState();
setInterval(render, 1000);
setInterval(loadState, 30000);
</script>
</body>
</html>
