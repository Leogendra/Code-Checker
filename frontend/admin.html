<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        * {
            font-family: "SF Mono", "Consolas", monospace !important; /* override global font */
        }
        .admin {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: min(560px, 100%);
        }

        .admin h1 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }

        .login {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .login input {
            width: 260px;
            height: 44px;
            padding: 0 14px;
            background: var(--glass-bg);
            color: var(--text);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .login input:focus {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.08);
        }

        .rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 32px 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .row .fid {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .row .status {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
        }

        .row.solved .status {
            color: var(--ok);
        }

        .row.locked .status {
            color: var(--ko);
        }

        .row button {
            padding: 8px 14px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            min-width: 90px;
        }

        .bulk {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .global-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .global-card.locked {
            border-color: rgba(248, 113, 113, 0.35);
        }

        .global-card-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .global-card-status {
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
        }

        .global-card.locked .global-card-status {
            color: var(--ko);
        }

        .global-card.free .global-card-status {
            color: var(--ok);
        }

        .global-card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .global-card-actions button {
            padding: 8px 14px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }

        .duration {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .duration label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .duration input {
            width: 70px;
            height: 30px;
            padding: 0 8px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            text-align: center;
        }

        .duration input:focus {
            border-color: var(--glass-border-strong);
        }

        .duration .hint {
            font-size: 0.7rem;
            color: var(--muted);
        }

        .msg {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 16px;
            letter-spacing: 0.03em;
        }

        .msg.err {
            color: var(--ko);
        }
    </style>
</head>

<body>
    <div class="admin">
        <h1>Admin</h1>

        <div id="login" class="login">
            <input id="pwd" type="password" placeholder="mot de passe" autocomplete="off" />
            <button id="login-btn">Entrer</button>
            <div id="login-msg" class="msg"></div>
        </div>

        <div id="panel" style="display:none; flex-direction:column; gap:24px;">
            <div id="global-card" class="global-card">
                <div class="global-card-info">
                    <div class="global-card-label">Verrou global</div>
                    <div id="global-status" class="global-card-status">—</div>
                </div>
                <div class="global-card-actions">
                    <button id="global-lock-btn">Verrouiller le site</button>
                    <button id="global-unlock-btn">Déverrouiller</button>
                </div>
            </div>

            <div class="duration">
                <label for="hours">Durée</label>
                <input id="hours" type="number" min="0" step="0.25" placeholder="∞" />
                <span class="hint">heures (vide = permanent)</span>
            </div>

            <div class="bulk">
                <button id="refresh">Rafraîchir</button>
                <button id="reset-btn">Reset champs</button>
            </div>

            <div id="rows" class="rows"></div>
            <div id="msg" class="msg"></div>
        </div>
    </div>

    <script>
        const NUM_FIELDS = 8;
        const PERMANENT_LOCK = "9999-12-31T00:00:00+00:00";

        const els = {
            login: document.getElementById("login"),
            pwd: document.getElementById("pwd"),
            loginBtn: document.getElementById("login-btn"),
            loginMsg: document.getElementById("login-msg"),
            panel: document.getElementById("panel"),
            rows: document.getElementById("rows"),
            msg: document.getElementById("msg"),
            refresh: document.getElementById("refresh"),
            resetBtn: document.getElementById("reset-btn"),
            hours: document.getElementById("hours"),
            globalCard: document.getElementById("global-card"),
            globalStatus: document.getElementById("global-status"),
            globalLockBtn: document.getElementById("global-lock-btn"),
            globalUnlockBtn: document.getElementById("global-unlock-btn"),
        };

        function getHours() {
            const raw = els.hours.value.trim();
            if (raw === "") return null;
            const n = Number(raw);
            if (!isFinite(n) || n <= 0) return null;
            return n;
        }

        function getToken() {
            return sessionStorage.getItem("admin_token") || "";
        }

        function setToken(t) {
            if (t) sessionStorage.setItem("admin_token", t);
            else sessionStorage.removeItem("admin_token");
        }

        async function api(method, path, body) {
            const opts = {
                method,
                headers: { "X-Admin-Token": getToken() },
            };
            if (body !== undefined) {
                opts.headers["Content-Type"] = "application/json";
                opts.body = JSON.stringify(body);
            }
            const r = await fetch(path, opts);
            if (r.status === 401) {
                setToken("");
                showLogin("Mot de passe incorrect.");
                throw new Error("unauthorized");
            }
            if (!r.ok) {
                const t = await r.text();
                throw new Error(t || r.statusText);
            }
            return r.json();
        }

        function showLogin(msg) {
            els.panel.style.display = "none";
            els.login.style.display = "flex";
            els.loginMsg.textContent = msg || "";
            els.loginMsg.classList.toggle("err", !!msg);
            els.pwd.focus();
        }

        function showPanel() {
            els.login.style.display = "none";
            els.panel.style.display = "flex";
        }

        function setMsg(text, isErr) {
            els.msg.textContent = text || "";
            els.msg.classList.toggle("err", !!isErr);
        }

        function formatLock(f) {
            if (f.solved) return "résolu";
            if (!f.locked_until) return "libre";
            if (f.permanent || f.locked_until === PERMANENT_LOCK) return "verrouillé (permanent)";
            const t = new Date(f.locked_until).getTime();
            const now = Date.now();
            if (t <= now) return "libre";
            const s = Math.floor((t - now) / 1000);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            const pad = (n) => String(n).padStart(2, "0");
            const cd = h > 0 ? `${h}h${pad(m)}` : `${m}:${pad(sec)}`;
            return `verrouillé (${cd})`;
        }

        let _globalUntil = null;

        function renderGlobal(data) {
            if (data && "global_locked_until" in data) _globalUntil = data.global_locked_until;
            const lu = _globalUntil;
            const t = lu ? new Date(lu).getTime() : 0;
            const active = lu && t > Date.now();
            els.globalCard.classList.toggle("locked", !!active);
            els.globalCard.classList.toggle("free", !active);
            if (!active) {
                els.globalStatus.textContent = "libre";
                els.globalUnlockBtn.disabled = true;
                return;
            }
            els.globalUnlockBtn.disabled = false;
            if (t > Date.now() + 365 * 24 * 3600 * 1000) {
                els.globalStatus.textContent = "verrouillé (permanent)";
                return;
            }
            const s = Math.floor((t - Date.now()) / 1000);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            const pad = (n) => String(n).padStart(2, "0");
            const cd = h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
            els.globalStatus.textContent = `verrouillé (${cd})`;
        }

        function renderRows(data) {
            els.rows.innerHTML = "";
            data.fields.forEach((f) => {
                const row = document.createElement("div");
                row.className = "row";
                if (f.solved) row.classList.add("solved");
                else if (f.locked_until) {
                    const t = new Date(f.locked_until).getTime();
                    if (f.permanent || t > Date.now()) row.classList.add("locked");
                }

                const fid = document.createElement("div");
                fid.className = "fid";
                fid.textContent = "#" + f.id;

                const status = document.createElement("div");
                status.className = "status";
                status.textContent = formatLock(f);

                const lockBtn = document.createElement("button");
                lockBtn.textContent = "Lock";
                lockBtn.disabled = f.solved;
                lockBtn.addEventListener("click", () => lockFields([f.id]));

                const unlockBtn = document.createElement("button");
                unlockBtn.textContent = "Unlock";
                unlockBtn.disabled = f.solved || !f.locked_until;
                unlockBtn.addEventListener("click", () => unlockFields([f.id]));

                row.append(fid, status, lockBtn, unlockBtn);
                els.rows.appendChild(row);
            });
        }

        async function refresh() {
            try {
                const data = await api("GET", "/api/admin/state");
                renderGlobal(data);
                renderRows(data);
                setMsg("");
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function globalLock() {
            const hours = getHours();
            try {
                await api("POST", "/api/admin/global-lock", { hours });
                setMsg(`Site verrouillé (${hours ? hours + "h" : "permanent"}).`);
                await refresh();
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function globalUnlock() {
            try {
                await api("POST", "/api/admin/global-unlock");
                setMsg("Site déverrouillé.");
                await refresh();
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function resetFields() {
            if (!confirm("Réinitialiser tous les champs (les réponses actuelles seront perdues) ?")) return;
            try {
                await api("POST", "/api/admin/reset");
                setMsg("Champs réinitialisés.");
                await refresh();
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function lockFields(ids) {
            const hours = getHours();
            try {
                await api("POST", "/api/admin/lock", { field_ids: ids, hours });
                const label = hours ? `${hours}h` : "permanent";
                setMsg(`Verrouillé (${label}) : ${ids.join(", ")}`);
                await refresh();
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function unlockFields(ids) {
            try {
                await api("POST", "/api/admin/unlock", { field_ids: ids });
                setMsg(`Déverrouillé : ${ids.join(", ")}`);
                await refresh();
            } catch (e) {
                if (e.message !== "unauthorized") setMsg("Erreur : " + e.message, true);
            }
        }

        async function login() {
            const t = els.pwd.value.trim();
            if (!t) return;
            setToken(t);
            try {
                await api("GET", "/api/admin/state");
                els.pwd.value = "";
                els.loginMsg.textContent = "";
                showPanel();
                await refresh();
            } catch (e) {
                // showLogin déjà appelée si 401
                if (e.message !== "unauthorized") {
                    setToken("");
                    showLogin("Erreur : " + e.message);
                }
            }
        }

        els.loginBtn.addEventListener("click", login);
        els.pwd.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
        els.globalLockBtn.addEventListener("click", globalLock);
        els.globalUnlockBtn.addEventListener("click", globalUnlock);
        els.refresh.addEventListener("click", refresh);
        els.resetBtn.addEventListener("click", resetFields);

        if (getToken()) {
            api("GET", "/api/admin/state").then(
                (data) => { showPanel(); renderGlobal(data); renderRows(data); },
                () => { /* showLogin déjà appelée si 401 */ }
            );
        } else {
            showLogin();
        }

        // décompte local rafraîchi chaque seconde (sans refetch)
        setInterval(() => {
            if (els.panel.style.display !== "none") renderGlobal();
        }, 1000);

        // refetch complet toutes les 15s
        setInterval(() => {
            if (els.panel.style.display !== "none") refresh();
        }, 15000);
    </script>
</body>

</html>
