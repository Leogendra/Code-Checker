<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>

<body>
    <div class="admin">
        <h1>Admin</h1>

        <div id="login" class="login">
            <input id="pwd" type="password" placeholder="mot de passe" autocomplete="off" />
            <button id="login-btn">Entrer</button>
            <div id="login-msg" class="msg"></div>
        </div>

        <div id="panel" style="display:none; flex-direction:column; gap:24px;">
            <div id="global-card" class="global-card">
                <div class="global-card-info">
                    <div class="global-card-label">Verrou global</div>
                    <div id="global-status" class="global-card-status">—</div>
                </div>
                <div class="global-card-actions">
                    <button id="global-lock-btn">Verrouiller le site</button>
                    <button id="global-unlock-btn">Déverrouiller</button>
                </div>
            </div>

            <div class="duration">
                <label for="minutes">Durée</label>
                <input id="minutes" type="number" min="0" step="1" placeholder="∞" />
                <span class="hint">minutes (vide = permanent)</span>
            </div>

            <div class="message-card">
                <label for="msg">Message joueur</label>
                <input id="msg" type="text" maxlength="280" autocomplete="off"
                    placeholder="affiché sous les champs (vide = aucun)" />
                <div class="message-row">
                    <button id="msg-send">Envoyer</button>
                    <button id="msg-clear">Effacer</button>
                    <span class="hint">masqué pendant un verrou global</span>
                </div>
                <div id="msg-current" class="message-current"></div>
            </div>

            <div class="bulk">
                <button id="refresh">Rafraîchir</button>
                <button id="reset-btn">Reset champs</button>
            </div>

            <div id="rows" class="rows"></div>
            <div id="msg" class="msg"></div>
        </div>
    </div>

    <script src="scripts/admin.js"></script>
</body>

</html>
