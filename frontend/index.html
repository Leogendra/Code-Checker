<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Checker</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="board">
        <div class="code-wrap">
            <div id="global-lock" class="global-lock"></div>
            <div class="code" id="code"></div>
        </div>

        <div id="status"></div>

        <div class="submit-row" id="submit-row">
            <button id="submit-btn">Valider</button>
            <!-- <button id="clear-btn" class="secondary">Effacer</button> -->
        </div>

        <!-- Carte finale : affichée d'office à la réussite, elle porte ses propres actions -->
        <div id="final" class="final"></div>
    </div>

    <script src="scripts/app.js"></script>
</body>

</html>
